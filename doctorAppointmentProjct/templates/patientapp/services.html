{% extends 'patientapp/base.html' %}


{% block content %}

 <div class="text-center mt-4 mb-3">
    <button class="btn btn-light btn-lg" style="width: 300px;">--- OUR SERVICES ---</button>
  </div>


  <div class="row">
    {% for service in services %}
    <div class="col-sm-6 p-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{service.name}}</h5>
            <p class="card-text">
              {{service.description|slice:":150"}} ...
            </p>
            <a href="{% url 'services_detail' service.id %}" class="btn btn-primary">View Detail</a>
          </div>
        </div>
      </div>
      {% endfor %}

  </div>
  

{% endblock %}
