{% extends 'patientapp/base.html' %}


{% block content %}

<div class="text-center mt-4 mb-3">
    <button class="btn btn-light btn-lg" style="width: 300px;">--- DOCTOR LIST ---</button>
</div>



<div class="mt-3 mb-3 p-4">
    <div class="card text-center p-3">
        <div class="row row-cols-1 row-cols-md-3 g-4">

            {% for doctor in doctors %}
            <div class="col">
                <div class="card h-100">
                    <img src="/media/{{doctor.photoDoctor}}" class="card-img-top" alt="..." height="300px" />
                    <div class="card-body">
                        <h5 class="card-title">{{doctor.fullName}}</h5>
                        <p class="card-text">
                            {{doctor.aboutDoctor|slice:":200"}}
                        </p>
                        <a href="{% url 'doctor-detail' doctor.id %}" class="btn btn-primary">View Detail</a>
                    </div>
                </div>
            </div>

            {% empty %}

            <h2 class="text-center">No doctors found</h2>

            {% endfor %}
            
        </div>
    </div>
</div>




{% endblock %}
